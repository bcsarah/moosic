<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moosic</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <!-- HEADER -->
    <header class="topo">
        <a class="marca" href="#">
            <!-- Troque este caminho pela imagem/logo do projeto -->
            <img src="images/moosic.png" alt="Logo Moosic">
            <span>Moosic</span>
        </a>
    </header>

    <!-- LAYOUT -->
    <div class="layout">
        <aside class="menu">
            <h2>Biblioteca</h2>
            <nav aria-label="Categorias de músicas">
                <button class="botao-categoria ativo" data-categoria="todas">Todas as músicas</button>
                <button class="botao-categoria" data-categoria="rock">Rock</button>
                <button class="botao-categoria" data-categoria="metal">Metal</button>
                <button class="botao-categoria" data-categoria="pop">Pop</button>
                <button class="botao-categoria" data-categoria="eletronica">Eletrônica</button>
            </nav>
        </aside>

        <!-- MAIN -->
        <main class="conteudo">
            <h1 id="titulo-categoria">Todas as músicas</h1>
            <div class="catalogo">

                <!-- ROCK -->
                <article class="card" 
                    data-categoria="rock"
                    data-titulo="No Surprises"
                    data-artista="Radiohead"
                    data-album="OK Computer"
                    data-imagem="https://yt3.googleusercontent.com/SPHeXqlEhzw-pPbAx3AQU4HSD-XuSMlPtLsptfvHOjOTd6F_1ZbELaOYn1d8-jGZ5HW8O1R0pLqausuVZw=w544-h544-l90-rj"
                    data-audio="music/no-surprises.mp3">
                </article>

                <article class="card" 
                    data-categoria="rock"
                    data-titulo="Brain Damage"
                    data-artista="Pink Floud"
                    data-album="The Dark Side of the Moon"
                    data-imagem="https://yt3.googleusercontent.com/lfiVQfNhs8F77ZOE_OyAftPDGXNY8WfkIVg67gNVxaJHLef7QIXsm7CAcaT4o3AyyLTaQeqWguKel0g=w544-h544-l90-rj"
                    data-audio="music/brain-damage.mp3">
                </article>

                <article class="card" 
                    data-categoria="rock"
                    data-titulo="Wish You Were Here"
                    data-artista="Pink Floyd"
                    data-album="Wish You Were Here"
                    data-imagem="https://yt3.googleusercontent.com/k1P0nFYMJ4yLC3yUumEY021eI7zDr67r2DWOVvUVFowraXukUHHhf4TUOfVgGtnKx6YlJpnpEaskcmLE=w544-h544-l90-rj"
                    data-audio="music/wish-you-were-here.mp3">
                </article>

                <!-- METAL -->
                <article class="card" 
                    data-categoria="metal"
                    data-titulo="Psychosocial"
                    data-artista="Slipknot"
                    data-album="All hope is gone"
                    data-imagem="https://yt3.googleusercontent.com/BKN1q6592B6RRjUCzycpYLMsRXezlbNW7lbJ3Y1xDUuzdJ_D9tbhr9GHk2_STmHBcIZYu4mNpu1cGgTU=w544-h544-l90-rj"
                    data-audio="music/psychosocial.mp3">
                </article>

                <article class="card"
                    data-categoria="metal"
                    data-titulo="Duality"
                    data-artista="Slipknot"
                    data-album="The subliminal verses"
                    data-imagem="https://yt3.googleusercontent.com/NcBCPN1E4DVzkJ6qHmV-KXdxEBYNmvrGJ9OiwbLNDV-CwKVA9nmlFmwybpWohcbSfLl_BYcXzwhqzdyrEQ=w544-h544-l90-rj"
                    data-audio="music/duality.mp3">
                </article>

                <article class="card"
                    data-categoria="metal"
                    data-titulo="Eyeless"
                    data-artista="Slipknot"
                    data-album="Slipknot"
                    data-imagem="https://yt3.googleusercontent.com/byNGWYX5rhZtRzWTWPBxCP1KwyqcUWNFRH_yPpAuMo25SG9H7cAnin5JnJYASPFW4INlV1w739mhS7c=w544-h544-l90-rj"
                    data-audio="music/eyeless.mp3">
                </article>

                <!-- POP -->
                <article class="card"
                    data-categoria="pop"
                    data-titulo="Memórias"
                    data-artista="Yung Lixo"
                    data-album="13 Lentes de um Final Feliz"
                    data-imagem="https://yt3.googleusercontent.com/ntvm4B7kYkrdONg-EeeXHnWD-VBYzmEO5hnJ32fH-PrbBK2AgLruxyNYvAilM0h0wg3nDLCyDLSok2BP=w544-h544-l90-rj"
                    data-audio="music/memorias.mp3">
                </article>

                <article class="card"
                    data-categoria="pop"
                    data-titulo="Polaroid"
                    data-artista="Yung Lixo"
                    data-album="Polaroid"
                    data-imagem="https://yt3.googleusercontent.com/SlVQzIY-UiJbbIZ_4F4d5NZm6-klP0tgEwltWAjD78sntPl6YIE0hquZXIvzNYkTDvwdpN2YUE1KviGR=w544-h544-l90-rj"
                    data-audio="music/polaroid.mp3">
                </article>

                <article class="card"
                    data-categoria="pop"
                    data-titulo="Blue Hair"
                    data-artista="TV Girl"
                    data-album="Death of a Party Girl"
                    data-imagem="https://yt3.googleusercontent.com/fPdVeGe4CpIMpcTMhZPdQtjV6x6XM4OHdgHrGZHGi4KZRnWXkDFqb51buqG9KdI1Ek4V2MTe5stZxCg=w544-h544-l90-rj"
                    data-audio="music/blue-hair.mp3">
                </article>

                <!-- ELETRÔNICA -->
                <article class="card"
                    data-categoria="eletronica"
                    data-titulo="Track 10"
                    data-artista="Charli XCX"
                    data-album="POP 2"
                    data-imagem="https://yt3.googleusercontent.com/_aQ3dPLhxg5IXkxc8yglSjRCRUl4Ms8N6t1zzxT0KftnISe6jkih75uxXiCrilWrmnURFnIwZ5gbVo-_=w544-h544-l90-rj"
                    data-audio="music/track10.mp3">
                </article>

                <article class="card"
                    data-categoria="eletronica"
                    data-titulo="Under Your Spell"
                    data-artista="Snow Strippers"
                    data-album="Under Your Spell"
                    data-imagem="https://yt3.googleusercontent.com/pUye4CyYCOe7Z4_NQYO4yqazm4DN-FPtUdHAdCbTs9mx81BoXodt62vdbUrKWUb6_bkgIW9OpknfbX-3=w544-h544-l90-rj"
                    data-audio="music/under-your-spell.mp3">
                </article>

                <article class="card"
                    data-categoria="eletronica"
                    data-titulo="L'amour Toujours"
                    data-artista="Gigi D'Agostino"
                    data-album="Tecno Fes"
                    data-imagem="https://yt3.googleusercontent.com/78psDhXDFSP_AcoSLLgSB0584g-9VdHPi9G_ouUmUkoQXRzkDTYWi5M4LED8-2z3MZnOsDXqQwutUq0=w544-h544-l90-rj"
                    data-audio="music/toujours.mp3">
                </article>
            </div>
        </main>

    </div>

    <footer class="player">
        <!-- Informações da música -->
        <div class="track-info">
            <img
                id="player-imagem"
                src="images/moosic.png"
                alt="Capa do álbum"
            >

            <div class="track-texto">
                <strong id="track-name">Nenhuma música selecionada</strong>
                <span id="artist-name">Escolha uma música da biblioteca</span>
            </div>
        </div>

        <!-- Barra de progresso -->
        <div class="progresso-container">
            <span id="tempo-atual">0:00</span>

            <input
                type="range"
                id="barra-progresso"
                min="0"
                max="100"
                value="0"
                step="0.1"
                aria-label="Progresso da música"
            >

            <span id="duracao-total">0:00</span>
        </div>

        <!-- Botão de reprodução -->
        <div class="player-controles">
            <button
                id="play-button"
                type="button"
                aria-label="Reproduzir"
            >▶</button>
        </div>

        <!-- Áudio -->
        <audio id="audio" preload="metadata"></audio>
    </footer>

    <!-- JS Externo -->
    <script src="script/script.js"></script>
</body>
</html>
